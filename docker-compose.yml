version: '3.8'

# ==============================================================================
# Risk Alert Dashboard - Default Docker Compose Configuration (Production Mode)
#
# Quick Start:
#   Development: docker compose -f docker-compose.dev.yml up --build
#   Production:  docker compose -f docker-compose.prod.yml up -d --build
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: risk_alert_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-risk_alert_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-risk_alert_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-risk_alert_db}
    volumes:
      - risk_alert_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: risk_alert_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-risk_alert_user}:${POSTGRES_PASSWORD:-risk_alert_secret_password}@postgres:5432/${POSTGRES_DB:-risk_alert_db}
      WORKERS: ${WORKERS:-4}
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: risk_alert_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  risk_alert_pgdata:
