name: CI/CD Pipeline - Build, Test & Auto-Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Custom image tag (optional, defaults to sha-<short-sha> and latest)'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Build Docker Images & Push to Harbor
  # ============================================================================
  build-and-push:
    name: 1. Build & Push Images to Harbor
    runs-on: self-hosted
    outputs:
      sha_short: ${{ steps.meta.outputs.sha_short }}
      backend_repo: ${{ steps.meta.outputs.backend_repo }}
      frontend_repo: ${{ steps.meta.outputs.frontend_repo }}
      deploy_tag: ${{ steps.meta.outputs.deploy_tag }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Extract Metadata and Tags
        id: meta
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

          # Support both GitHub Secrets and GitHub Variables
          REGISTRY="${{ secrets.HARBOR_URL || vars.HARBOR_URL }}"
          PROJECT="${{ secrets.HARBOR_PROJECT || vars.HARBOR_PROJECT }}"
          
          CLEAN_REGISTRY=$(echo "$REGISTRY" | sed -e 's|^https://||' -e 's|^http://||' -e 's|/$||')
          CLEAN_PROJECT=$(echo "$PROJECT" | sed -e 's|^/||' -e 's|/$||')

          BACKEND_REPO="${CLEAN_REGISTRY}/${CLEAN_PROJECT}/backend"
          FRONTEND_REPO="${CLEAN_REGISTRY}/${CLEAN_PROJECT}/frontend"

          echo "registry=${CLEAN_REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "backend_repo=${BACKEND_REPO}" >> "$GITHUB_OUTPUT"
          echo "frontend_repo=${FRONTEND_REPO}" >> "$GITHUB_OUTPUT"

          if [ -n "${{ inputs.custom_tag }}" ]; then
            echo "deploy_tag=${{ inputs.custom_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_tag=sha-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Insecure HTTP Registry if needed
        run: |
          REGISTRY="${{ steps.meta.outputs.registry }}"
          if [ -n "$REGISTRY" ]; then
            if [ -f /etc/docker/daemon.json ] && grep -q "\"$REGISTRY\"" /etc/docker/daemon.json 2>/dev/null; then
              echo "✅ Registry $REGISTRY is already in /etc/docker/daemon.json"
            else
              echo "🔧 Configuring Docker daemon insecure-registries for $REGISTRY..."
              SUDO_CMD=""
              if [ "$EUID" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
                SUDO_CMD="sudo"
              fi
              $SUDO_CMD mkdir -p /etc/docker
              if [ -f /etc/docker/daemon.json ]; then
                if command -v jq >/dev/null 2>&1; then
                  jq '.["insecure-registries"] = ((.["insecure-registries"] // []) + ["'"$REGISTRY"'"] | unique)' /etc/docker/daemon.json > /tmp/daemon.json && \
                  $SUDO_CMD mv /tmp/daemon.json /etc/docker/daemon.json
                fi
              else
                echo "{\"insecure-registries\": [\"$REGISTRY\"]}" | $SUDO_CMD tee /etc/docker/daemon.json > /dev/null
              fi
              $SUDO_CMD systemctl restart docker || true
            fi
          fi

      - name: Authenticate to Harbor Container Registry
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USERNAME || vars.HARBOR_USERNAME }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD || vars.HARBOR_PASSWORD }}
          REGISTRY: ${{ steps.meta.outputs.registry }}
        run: |
          if [ -z "$HARBOR_USER" ]; then
            echo "❌ Error: HARBOR_USERNAME is empty!"
            echo "   Please add HARBOR_USERNAME in GitHub Repository Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$HARBOR_PASS" | docker login "$REGISTRY" -u "$HARBOR_USER" --password-stdin

      - name: Build & Tag Backend Docker Image
        run: |
          BACKEND_REPO="${{ steps.meta.outputs.backend_repo }}"
          SHA_TAG="${BACKEND_REPO}:sha-${{ steps.meta.outputs.sha_short }}"
          LATEST_TAG="${BACKEND_REPO}:latest"

          echo "Building Backend image: ${SHA_TAG}"
          docker build \
            -t "${SHA_TAG}" \
            -t "${LATEST_TAG}" \
            -f backend/Dockerfile \
            backend

          if [ -n "${{ inputs.custom_tag }}" ]; then
            CUSTOM_TAG="${BACKEND_REPO}:${{ inputs.custom_tag }}"
            echo "Tagging custom image: ${CUSTOM_TAG}"
            docker tag "${LATEST_TAG}" "${CUSTOM_TAG}"
            docker push "${CUSTOM_TAG}"
          fi

          echo "Pushing Backend images to Harbor..."
          docker push "${SHA_TAG}"
          docker push "${LATEST_TAG}"

      - name: Build & Tag Frontend Docker Image
        run: |
          FRONTEND_REPO="${{ steps.meta.outputs.frontend_repo }}"
          SHA_TAG="${FRONTEND_REPO}:sha-${{ steps.meta.outputs.sha_short }}"
          LATEST_TAG="${FRONTEND_REPO}:latest"

          echo "Building Frontend image (validates TypeScript & Vite bundle): ${SHA_TAG}"
          docker build \
            -t "${SHA_TAG}" \
            -t "${LATEST_TAG}" \
            -f frontend/Dockerfile \
            frontend

          if [ -n "${{ inputs.custom_tag }}" ]; then
            CUSTOM_TAG="${FRONTEND_REPO}:${{ inputs.custom_tag }}"
            echo "Tagging custom image: ${CUSTOM_TAG}"
            docker tag "${LATEST_TAG}" "${CUSTOM_TAG}"
            docker push "${CUSTOM_TAG}"
          fi

          echo "Pushing Frontend images to Harbor..."
          docker push "${SHA_TAG}"
          docker push "${LATEST_TAG}"

  # ============================================================================
  # 2. Run Integration Tests in Containerized Environment
  # ============================================================================
  test:
    name: 2. Run Test Suite
    needs: [build-and-push]
    runs-on: self-hosted
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Run Test Suite against Containerized PostgreSQL
        env:
          BACKEND_IMAGE: "${{ needs.build-and-push.outputs.backend_repo }}:${{ needs.build-and-push.outputs.deploy_tag }}"
          CI_NET: "ci_net_${{ github.run_id }}"
          CI_PG: "ci_pg_${{ github.run_id }}"
        run: |
          echo "Setting up isolated test network: ${CI_NET}"
          docker network create "${CI_NET}"

          echo "Starting temporary PostgreSQL test container..."
          docker run -d \
            --name "${CI_PG}" \
            --network "${CI_NET}" \
            -e POSTGRES_USER=risk_alert_user \
            -e POSTGRES_PASSWORD=risk_alert_secret_password \
            -e POSTGRES_DB=risk_alert_test_db \
            postgres:16-alpine

          echo "Waiting for test database readiness..."
          for i in {1..30}; do
            if docker exec "${CI_PG}" pg_isready -U risk_alert_user -d risk_alert_test_db >/dev/null 2>&1; then
              echo "✅ Test database is ready!"
              break
            fi
            sleep 1
          done

          echo "Running Pytest inside freshly built image: ${BACKEND_IMAGE}"
          docker run --rm \
            --network "${CI_NET}" \
            -e PYTHONPATH=/app \
            -e DATABASE_URL="postgresql+asyncpg://risk_alert_user:risk_alert_secret_password@${CI_PG}:5432/risk_alert_test_db" \
            -e TEST_DATABASE_URL="postgresql+asyncpg://risk_alert_user:risk_alert_secret_password@${CI_PG}:5432/risk_alert_test_db" \
            -e QUALYS_MOCK_MODE=true \
            -e MISP_MOCK_MODE=true \
            "${BACKEND_IMAGE}" \
            pytest tests/test_misp_assessment.py

      - name: Clean Up Test Containers
        if: always()
        env:
          CI_NET: "ci_net_${{ github.run_id }}"
          CI_PG: "ci_pg_${{ github.run_id }}"
        run: |
          echo "Tearing down temporary test containers and network..."
          docker stop "${CI_PG}" 2>/dev/null || true
          docker rm -f "${CI_PG}" 2>/dev/null || true
          docker network rm "${CI_NET}" 2>/dev/null || true

  # ============================================================================
  # 3. Deploy to Production Server (Only if Tests Pass)
  # ============================================================================
  deploy:
    name: 3. Auto-Deploy to Production
    needs: [build-and-push, test]
    if: needs.test.result == 'success'
    runs-on: self-hosted
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Locate Server Production Configuration
        run: |
          if [ ! -f .env.production ]; then
            for candidate in \
              "${HOME}/alert-dashboard/.env.production" \
              "${HOME}/dashboard_alert/.env.production" \
              "${HOME}/.env.production" \
              "/opt/alert-dashboard/.env.production" \
              "/opt/dashboard_alert/.env.production"; do
              if [ -f "$candidate" ]; then
                echo "📋 Found server configuration at $candidate -> copying to runner workspace"
                cp "$candidate" .env.production
                ln -sf .env.production .env
                break
              fi
            done
          fi

      - name: Execute Server Deployment Script
        env:
          DEPLOY_TAG: "${{ needs.build-and-push.outputs.deploy_tag }}"
        run: |
          echo "================================================================="
          echo " 🚀 Auto-Deploying Tag: ${DEPLOY_TAG}"
          echo "================================================================="
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh "${DEPLOY_TAG}"

      - name: Verify Running Containers Health
        run: |
          docker compose -f docker-compose.prod.yml ps
          echo "================================================================="
          echo " ✅ Production Auto-Deployment Completed Successfully!"
          echo "================================================================="
