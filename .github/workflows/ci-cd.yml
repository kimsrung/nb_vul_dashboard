name: CI/CD Pipeline - Build, Test & Push to Harbor

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip automated test suite (emergency deployment)'
        required: false
        type: boolean
        default: false
      custom_tag:
        description: 'Custom image tag (optional, defaults to sha-<short-sha> and latest)'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Automated Testing & Verification Gate
  # ============================================================================
  test:
    name: Run Test Suite & Build Verification
    runs-on: self-hosted
    if: ${{ !inputs.skip_tests }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Test Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        run: |
          cd backend
          PYTHONPATH=. pytest

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Bundle (TypeScript & Vite)
        run: |
          cd frontend
          npm run build

  # ============================================================================
  # 2. Build Docker Images & Push to Harbor Registry
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Images to Harbor
    needs: [test]
    if: always() && (needs.test.result == 'success' || inputs.skip_tests == true)
    runs-on: self-hosted
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Extract Metadata and Tags
        id: meta
        run: |
          # Compute short commit SHA
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

          # Determine registry endpoints and repository names
          REGISTRY="${{ secrets.HARBOR_URL }}"
          PROJECT="${{ secrets.HARBOR_PROJECT }}"
          
          # Strip trailing slashes or protocol schemes if present
          CLEAN_REGISTRY=$(echo "$REGISTRY" | sed -e 's|^https://||' -e 's|^http://||' -e 's|/$||')
          CLEAN_PROJECT=$(echo "$PROJECT" | sed -e 's|^/||' -e 's|/$||')

          echo "registry=${CLEAN_REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "backend_repo=${CLEAN_REGISTRY}/${CLEAN_PROJECT}/backend" >> "$GITHUB_OUTPUT"
          echo "frontend_repo=${CLEAN_REGISTRY}/${CLEAN_PROJECT}/frontend" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Harbor Container Registry
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login "${{ steps.meta.outputs.registry }}" \
            -u "${{ secrets.HARBOR_USERNAME }}" \
            --password-stdin

      - name: Build & Tag Backend Docker Image
        run: |
          BACKEND_REPO="${{ steps.meta.outputs.backend_repo }}"
          SHA_TAG="${BACKEND_REPO}:sha-${{ steps.meta.outputs.sha_short }}"
          LATEST_TAG="${BACKEND_REPO}:latest"

          echo "Building Backend image: ${SHA_TAG}"
          docker build \
            -t "${SHA_TAG}" \
            -t "${LATEST_TAG}" \
            -f backend/Dockerfile \
            backend

          if [ -n "${{ inputs.custom_tag }}" ]; then
            CUSTOM_TAG="${BACKEND_REPO}:${{ inputs.custom_tag }}"
            echo "Tagging custom image: ${CUSTOM_TAG}"
            docker tag "${LATEST_TAG}" "${CUSTOM_TAG}"
            docker push "${CUSTOM_TAG}"
          fi

          echo "Pushing Backend images to Harbor..."
          docker push "${SHA_TAG}"
          docker push "${LATEST_TAG}"

      - name: Build & Tag Frontend Docker Image
        run: |
          FRONTEND_REPO="${{ steps.meta.outputs.frontend_repo }}"
          SHA_TAG="${FRONTEND_REPO}:sha-${{ steps.meta.outputs.sha_short }}"
          LATEST_TAG="${FRONTEND_REPO}:latest"

          echo "Building Frontend image: ${SHA_TAG}"
          docker build \
            -t "${SHA_TAG}" \
            -t "${LATEST_TAG}" \
            -f frontend/Dockerfile \
            frontend

          if [ -n "${{ inputs.custom_tag }}" ]; then
            CUSTOM_TAG="${FRONTEND_REPO}:${{ inputs.custom_tag }}"
            echo "Tagging custom image: ${CUSTOM_TAG}"
            docker tag "${LATEST_TAG}" "${CUSTOM_TAG}"
            docker push "${CUSTOM_TAG}"
          fi

          echo "Pushing Frontend images to Harbor..."
          docker push "${SHA_TAG}"
          docker push "${LATEST_TAG}"

      - name: Harbor Deployment Summary
        run: |
          echo "================================================================="
          echo " Successfully pushed Docker images to Harbor Registry!"
          echo " Backend:"
          echo "   - ${{ steps.meta.outputs.backend_repo }}:latest"
          echo "   - ${{ steps.meta.outputs.backend_repo }}:sha-${{ steps.meta.outputs.sha_short }}"
          echo " Frontend:"
          echo "   - ${{ steps.meta.outputs.frontend_repo }}:latest"
          echo "   - ${{ steps.meta.outputs.frontend_repo }}:sha-${{ steps.meta.outputs.sha_short }}"
          echo "================================================================="
          echo " Deploy on server with: ./scripts/deploy.sh [tag]"
          echo "================================================================="
