version: '3.8'

# ==============================================================================
# Production Stack: Hardened Multi-Worker Deployment behind Corporate Proxy
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: risk_alert_prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-risk_alert_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}
      POSTGRES_DB: ${POSTGRES_DB:-risk_alert_db}
    volumes:
      - risk_alert_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: risk_alert_prod_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-risk_alert_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-risk_alert_db}
      WORKERS: ${WORKERS:-4}
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: risk_alert_prod_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  risk_alert_pgdata_prod:
